name: RH-WEBSITE syntax and smoke checks

on:
  push:
    branches: [main]
    paths:
      - "**.js"
      - "index.html"
      - ".github/workflows/client-check.yml"
  pull_request:
    paths:
      - "**.js"
      - "index.html"
      - ".github/workflows/client-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser scripts
        run: node --check app.js && node --check admin.js && node --check mobile-nav.js
      - name: Check Cloudflare Worker module syntax
        run: node --input-type=module --check < worker.js
      - name: Smoke test Cloudflare API
        run: |
          node --input-type=module -e 'const r=await fetch("https://rh-website-api.rh-website.workers.dev/api"); if(!r.ok) throw new Error("API HTTP "+r.status); const d=await r.json(); if(d.status!=="online") throw new Error("Unexpected API response"); console.log("API online:",d.service,d.version)'
      - name: Smoke test latest RH-WEBSITE deployment and assets
        run: |
          node --input-type=module -e 'const base="https://b3521304.rh-website-9mb.pages.dev"; const [r,a,c]=await Promise.all([fetch(base+"/"),fetch(base+"/app.js"),fetch(base+"/styles.css")]); if(!r.ok||!a.ok||!c.ok) throw new Error("Pages asset HTTP "+[r.status,a.status,c.status].join("/")); const h=await r.text(); if(!h.includes("RH MEDIA")||!h.includes("app.js")) throw new Error("Unexpected Pages document"); console.log("Pages and assets online:",r.status,a.status,c.status)'
      - name: Smoke test D1-backed API routes and CORS
        run: |
          node --input-type=module -e 'const base="https://rh-website-api.rh-website.workers.dev"; const origin="https://rh-website-9mb.pages.dev"; for (const [path,key] of [["/api/users","users"],["/api/feed","posts"],["/api/videos","videos"],["/api/game-rooms","rooms"]]) { const r=await fetch(base+path,{headers:{Origin:origin}}); if(!r.ok) throw new Error(path+" HTTP "+r.status); const d=await r.json(); if(!Array.isArray(d[key])) throw new Error(path+" returned no "+key+" array"); if(r.headers.get("access-control-allow-origin")!==origin) throw new Error(path+" CORS origin mismatch"); console.log(path,"OK",d[key].length); }'

