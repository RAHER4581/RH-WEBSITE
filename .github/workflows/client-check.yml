name: RH-WEBSITE syntax and smoke checks

on:
  push:
    branches: [main]
    paths:
      - "**.js"
      - "index.html"
      - ".github/workflows/client-check.yml"
  pull_request:
    paths:
      - "**.js"
      - "index.html"
      - ".github/workflows/client-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser scripts
        run: node --check app.js && node --check admin.js && node --check mobile-nav.js
      - name: Check Cloudflare Worker module syntax
        run: node --input-type=module --check < worker.js
      - name: Smoke test Cloudflare API
        run: |
          node --input-type=module -e 'const r=await fetch("https://rh-website-api.rh-website.workers.dev/api"); if(!r.ok) throw new Error("API HTTP "+r.status); const d=await r.json(); if(d.status!=="online") throw new Error("Unexpected API response"); console.log("API online:",d.service,d.version)'
      - name: Smoke test Cloudflare Pages
        run: |
          node --input-type=module -e 'const r=await fetch("https://rh-website-9mb.pages.dev/"); if(!r.ok) throw new Error("Pages HTTP "+r.status); const h=await r.text(); if(!h.includes("RH MEDIA") || !h.includes("app.js")) throw new Error("Unexpected Pages document"); console.log("Pages online:",r.status)'
