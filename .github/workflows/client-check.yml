name: RH-WEBSITE syntax checks

on:
  push:
    branches: [main]
    paths:
      - "**.js"
      - ".github/workflows/client-check.yml"
  pull_request:
    paths:
      - "**.js"
      - ".github/workflows/client-check.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser scripts
        run: node --check app.js && node --check admin.js && node --check mobile-nav.js
      - name: Check Cloudflare Worker module syntax
        run: node --input-type=module --check < worker.js
